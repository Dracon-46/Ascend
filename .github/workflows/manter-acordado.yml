# Mantém o Ascend acordado no plano gratuito do Render, que desliga o serviço depois de
# 15 minutos sem tráfego. O agendador interno do Ascend consulta o banco a cada 15 minutos
# enquanto ele está acordado, o que também evita a pausa do Supabase gratuito.
#
# Só das 07:00 às 23:59 (Brasília; 10:00 às 02:59 UTC): as 750 horas gratuitas por mês são
# do workspace inteiro do Render, dividido com outros serviços (AetherTable). Acordado o dia
# todo, o Ascend usaria 744 horas e o Render suspenderia todos os serviços gratuitos do
# workspace até o mês seguinte. Assim ele usa cerca de 520 horas.
#
# A cada 5 minutos: o agendamento do GitHub Actions costuma atrasar alguns minutos.
# Repositório público: os minutos do Actions são gratuitos. O GitHub desliga agendamentos de
# repositórios públicos sem commits há 60 dias; se isso acontecer, reative em Actions.
name: Manter o Ascend acordado

on:
  schedule:
    - cron: "*/5 0-2,10-23 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar /api/health
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 https://falkyria-ascend.onrender.com/api/health
